name: Build Plugin

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Build with dotnet
      run: dotnet build SteamScraper.sln --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SteamScraper-Plugin
        path: SteamScraper/bin/Release/
